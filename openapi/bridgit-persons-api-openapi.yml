          description: Validation failure - The person is already active in the account
components:
  schemas:
    FieldValuesPair:
      type: object
      properties:
        fieldId:
          type: integer
          format: int64
          example: 1394
        values:
          type: array
          items:
            type: string
          nullable: true
          example:
          - '5195555555'
      additionalProperties: false
    PersonNextAvailable:
      type: object
      properties:
        personId:
          type: integer
          format: int64
          example: 8673
        nextAvailableDate:
          type: string
          format: date-time
          nullable: true
          example: '2019-01-01'
        availableInDays:
          type: integer
          format: int32
          example: 82
        availabilities:
          type: array
          items:
            $ref: '#/components/schemas/Availability'
          nullable: true
      additionalProperties: false
    NewPersonRequest:
      type: object
      properties:
        email:
          type: string
          format: email
          nullable: true
          example: jayne@example.com
        uniqueId:
          type: string
          nullable: true
          example: This is a unique string that is less than 255 characters
        name:
          maxLength: 250
          minLength: 1
          type: string
          nullable: true
          example: Jayne Peters
        type:
          enum:
          - Salaried
          - Hourly
          type: string
          example: Salaried
        title:
          maxLength: 250
          minLength: 1
          type: string
          nullable: true
          example: Project Engineer
        photoUrl:
          type: string
          format: uri
          nullable: true
          example: https://www.example.com/jayne.png
        employmentDates:
          type: object
          additionalProperties:
            type: string
            format: date-time
            nullable: true
          description: Request object for representing employment dates on a person.
          nullable: true
        workDays:
          minItems: 1
          type: array
          items:
            enum:
            - 0
            - 1
            - 2
            - 3
            - 4
            - 5
            - 6
            type: integer
            format: int32
          default:
          - 1
          - 2
          - 3
          - 4
          - 5
          nullable: true
          example:
          - 1
          - 2
          - 3
          - 4
          - 5
        fields:
          type: array
          items:
            $ref: '#/components/schemas/FieldValuesPair'
          nullable: true
        groupings:
          minItems: 1
          type: array
          items:
            type: integer
            format: int64
          nullable: true
        industryStartDate:
          type: string
          format: date-time
          nullable: true
          example: '2020-01-01T00:00:00Z'
      additionalProperties: false
    PersonDeactivateRequest:
      type: object
      properties:
        deactivationReason:
          maxLength: 100
          minLength: 0
          type: string
          nullable: true
        deactivationNotes:
          maxLength: 240
          minLength: 0
          type: string
          nullable: true
        wouldRehire:
          type: boolean
          nullable: true
        employmentEndDate:
          type: string
          format: date-time
          nullable: true
      additionalProperties: false
    PersonFilterPredicatesFilter:
      type: object
      properties:
        offset:
          type: integer
          format: int32
        limit:
          type: integer
          format: int32
        predicates:
          $ref: '#/components/schemas/PersonFilterPredicates'
      additionalProperties: false
    PersonProjectResponse:
      type: object
      properties:
        id:
          type: integer
          format: int64
          example: 8673
        name:
          type: string
          nullable: true
          example: Ahrens Lofts
        startDate:
          type: string
          format: date-time
        endDate:
          type: string
          format: date-time
        projectType:
          enum:
          - Awarded
          - Opportunity
          type: string
        projectStatus:
          enum:
          - Canceled
          - Upcoming
          - Active
          - Complete
          - Pursuit
          - Lost
          type: string
      additionalProperties: false
    PersonResponse:
      type: object
      properties:
        id:
          type: integer
          format: int64
        email:
          type: string
          nullable: true
        externalId:
          type: string
          nullable: true
        uniqueId:
          type: string
          nullable: true
        name:
          type: string
          nullable: true
        type:
          enum:
          - Salaried
          - Hourly
          type: string
        title:
          type: string
          nullable: true
        photoUrl:
          type: string
          nullable: true
        state:
          enum:
          - Active
          - Deactivated
          - All
          type: string
        hasConflict:
          type: boolean
          readOnly: true
        nextConflict:
          type: string
          format: date-time
          nullable: true
        lastModifiedOn:
          type: string
          format: date-time
        hourlyCostRate:
          type: number
          format: double
          nullable: true
        employmentDates:
          $ref: '#/components/schemas/EmploymentDatesResponse'
        workDays:
          type: array
          items:
            enum:
            - 0
            - 1
            - 2
            - 3
            - 4
            - 5
            - 6
            type: integer
            format: int32
          nullable: true
        groupings:
          type: array
          items:
            type: integer
            format: int64
          nullable: true
        industryStartDate:
          type: string
          format: date-time
          nullable: true
        deactivationReason:
          type: string
          nullable: true
        deactivationNotes:
          type: string
          nullable: true
        wouldRehire:
          type: boolean
          nullable: true
      additionalProperties: false
    ExternalIdRequest:
      type: object
      properties:
        externalId:
          type: string
          nullable: true
      additionalProperties: false
    Project:
      type: object
      properties:
        id:
          type: integer
          format: int64
          example: 9381
        name:
          type: string
          nullable: true
          example: Ahrens Lofts
        colour:
          type: string
          nullable: true
        startDate:
          type: string
          format: date-time
        endDate:
          type: string
          format: date-time
        projectType:
          enum:
          - Awarded
          - Opportunity
          type: string
        state:
          enum:
          - Canceled
          - Upcoming
          - Active
          - Complete
          - Pursuit
          - Lost
          type: string
          readOnly: true
      additionalProperties: false
    EmploymentDatesResponse:
      type: object
      properties:
        startDate:
          type: string
          format: date-time
          nullable: true
        endDate:
          type: string
          format: date-time
          nullable: true
      additionalProperties: false
    PersonFilterPredicates:
      type: object
      properties:
        personIds:
          type: array
          items:
            type: integer
            format: int64
          nullable: true
        state:
          enum:
          - Active
          - Deactivated
          - All
          type: string
        email:
          type: string
          nullable: true
        uniqueId:
          type: string
          nullable: true
        relativeDate:
          type: string
          format: date-time
      additionalProperties: false
    PersonAllocationResponse:
      type: object
      properties:
        projectId:
          type: integer
          format: int64
        projectName:
          type: string
          nullable: true
        projectColour:
          type: string
          nullable: true
        projectType:
          enum:
          - Awarded
          - Opportunity
          type: string
        projectStatus:
          enum:
          - Canceled
          - Upcoming
          - Active
          - Complete
          - Pursuit
          - Lost
          type: string
          nullable: true
        taskId:
          type: string
          format: uuid
          nullable: true
        roleId:
          type: integer
          format: int64
        roleName:
          type: string
          nullable: true
        startDate:
          type: string
          format: date-time
        endDate:
          type: string
          format: date-time
        allocatedPercent:
          type: integer
          format: int32
      additionalProperties: false
    Availability:
      type: object
      properties:
        startDate:
          type: string
          format: date-time
          example: '2021-01-01'
        endDate:
          type: string
          format: date-time
          example: '2021-12-31'
        availablePercent:
          type: integer
          format: int32
          nullable: true
          example: 100
        reason:
          enum:
          - Available
          - Allocated
          - PreEmployment
          - PostEmployment
          - Unavailability
          type: string
          nullable: true
      additionalProperties: false
    PersonProjectList:
      type: object
      properties:
        personId:
          type: integer
          format: int64
          example: 8673
        projects:
          type: array
          items:
            $ref: '#/components/schemas/Project'
          nullable: true
      additionalProperties: false
  securitySchemes:
    Bearer:
      type: http
      description: Standard Authorization header using the Bearer scheme
      scheme: bearer
      bearerFormat: JWT
