                  type: 0
                  id: 00000000-0000-0000-0000-000000000000
                  titleIdAtAssignment: null
                  upcomingTimeOff: null
                taskName: null
                categoryId: null
                categoryName: null
              - roleId: 8674
                taskId: null
                allocations:
                - personCost: 123.45
                  personId: 2234
                  name: James William
                  title: Project Manager
                  state: Active
                  startDate: '2019-01-01'
                  endDate: '2019-12-31'
                  hasConflict: false
                  allocationState: Past
                  type: 0
                  id: 00000000-0000-0000-0000-000000000000
                  titleIdAtAssignment: null
                  upcomingTimeOff: null
                taskName: null
                categoryId: null
                categoryName: null
              - roleId: 8675
                taskId: null
                allocations:
                - personCost: 123.45
                  personId: 2234
                  name: Mary Johnson
                  title: Project Coordinator
                  state: Active
                  startDate: '2021-01-01'
                  endDate: '2021-12-31'
