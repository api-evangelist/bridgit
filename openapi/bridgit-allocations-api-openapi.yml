        '400':
          description: Bad Request
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
    post:
      tags:
      - Allocations
      summary: Allocates a person to a role on the given account and project
      description: 'A person cannot be allocated entirely inside a period of unavailability and cannot be allocated outside of their employment dates.


        For allocations that overlap a period of unavailability, the API will truncate or not set the date range that the person is unavailable.


        Examples: Unavaialble from 2020-01-11 to 2020-01-25, Allocation date from 2020-01-20 to 2020-03-31, will alocate the person from 2020-01-26 to 2020-03-31


        Unavaialble from 2020-01-11 to 2020-01-25, Allocation date from 2020-01-01 to 2020-03-31, will alocate the person from 2020-01-01 to 2020-01-10 AND 2020-01-26 to 2020-03-31

        Permissions

        Person: Read

        Role: Read

        Allocation: Write

        Private: Read'
      operationId: Allocations_Post
      parameters:
      - name: accountId
        in: path
        description: The Account ID
        required: true
        schema:
          type: integer
          format: int32
      - name: projectId
        in: path
        description: The Project ID
        required: true
        schema:
          type: integer
          format: int64
      requestBody:
        description: Request object containing the person, role, start and end date to allocate
        content:
          application/json-patch+json:
            schema:
              $ref: '#/components/schemas/ProjectAllocationRequest'
          application/json:
            schema:
              $ref: '#/components/schemas/ProjectAllocationRequest'
          text/json:
            schema:
              $ref: '#/components/schemas/ProjectAllocationRequest'
          application/*+json:
            schema:
              $ref: '#/components/schemas/ProjectAllocationRequest'
        required: true
      responses:
        '204':
          description: No Content
        '400':
          description: Bad Request
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
        '409':
          description: Conflict
        '422':
          description: Unprocessable Entity
    put:
      tags:
      - Allocations
      summary: Updates a person's allocation on a role on the given account and project
      description: 'A person cannot be allocated entirely inside a period of unavailability and cannot be allocated outside of their employment dates.


        For allocations that overlap a period of unavailability, the API will truncate or not set the date range that the person is unavailable.


        Examples: Unavaialble from 2020-01-11 to 2020-01-25, Allocation date from 2020-01-20 to 2020-03-31, will alocate the person from 2020-01-26 to 2020-03-31


        Unavaialble from 2020-01-11 to 2020-01-25, Allocation date from 2020-01-01 to 2020-03-31, will alocate the person from 2020-01-01 to 2020-01-10 AND 2020-01-26 to 2020-03-31

        Permissions

        Person: Read

        Role: Read

        Allocation: Write

        Private: Read'
      operationId: Allocations_Put
      parameters:
      - name: accountId
        in: path
        description: The Account ID
        required: true
        schema:
          type: integer
          format: int32
      - name: projectId
        in: path
        description: The Project ID
        required: true
        schema:
          type: integer
          format: int64
      requestBody:
        description: Request object containing the person, role, start and end date to allocate
        content:
          application/json-patch+json:
            schema:
              $ref: '#/components/schemas/ProjectAllocationRequest'
          application/json:
            schema:
              $ref: '#/components/schemas/ProjectAllocationRequest'
          text/json:
            schema:
              $ref: '#/components/schemas/ProjectAllocationRequest'
          application/*+json:
            schema:
              $ref: '#/components/schemas/ProjectAllocationRequest'
        required: true
      responses:
        '204':
          description: No Content
        '400':
          description: Bad Request
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
        '422':
          description: Unprocessable Entity
    delete:
      tags:
      - Allocations
      summary: Removes a person's allocation on a role on the given account and project
      description: 'The request must contain the role id, person id, start and end date to ensure that the role and allocation is correct and hasn''t been modified before trying to delete it.

        Permissions

        Person: Read

        Role: Read

        Allocation: Write'
      operationId: Allocations_Delete
      parameters:
      - name: accountId
        in: path
        description: The Account ID
        required: true
        schema:
          type: integer
          format: int32
      - name: projectId
        in: path
        description: The Project ID
        required: true
        schema:
          type: integer
          format: int64
      requestBody:
        description: Request object containing the person, role, start and end date to allocate
        content:
          application/json-patch+json:
            schema:
              $ref: '#/components/schemas/ProjectAllocationRequest'
          application/json:
            schema:
              $ref: '#/components/schemas/ProjectAllocationRequest'
          text/json:
            schema:
              $ref: '#/components/schemas/ProjectAllocationRequest'
          application/*+json:
            schema:
              $ref: '#/components/schemas/ProjectAllocationRequest'
        required: true
      responses:
        '204':
          description: No Content
        '400':
          description: Bad Request
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
        '422':
          description: Unprocessable Entity
components:
  schemas:
    ProjectAllocationRequest:
      type: object
      properties:
        roleId:
          type: integer
          format: int64
          example: 1
        personId:
          type: integer
          format: int64
          example: 1
        startDate:
          type:
          - string
          - 'null'
          format: date-time
          example: '2019-01-01'
        endDate:
          type:
          - string
          - 'null'
          format: date-time
          example: '2019-12-31'
        roleStartDate:
          type:
          - string
          - 'null'
          description: 'Optional. When provided, updates the unfilled role''s start date before creating the allocation.

            Must be set together with ResourcePlanning.Contracts.ProjectAllocationRequest.RoleEndDate — supplying only one will fail validation.'
          format: date-time
        roleEndDate:
          type:
          - string
          - 'null'
          description: 'Optional. When provided, updates the unfilled role''s end date before creating the allocation.

            Must be set together with ResourcePlanning.Contracts.ProjectAllocationRequest.RoleStartDate — supplying only one will fail validation.'
          format: date-time
      additionalProperties: false
    PersonAllocation:
      type: object
      properties:
        personCost:
          type:
          - number
          - 'null'
          format: double
          example: 123.45
        personId:
          type: integer
          format: int64
          example: 2324
        name:
          type:
          - string
          - 'null'
          example: John Smith
        title:
          type:
          - string
          - 'null'
          example: Project Engineer
        state:
          enum:
          - Active
          - Deactivated
          - All
          type: string
          example: Active
        startDate:
          type: string
          format: date-time
          example: '2020-01-01'
        endDate:
          type: string
          format: date-time
          example: '2020-12-31'
        hasConflict:
          type: boolean
          example: false
        allocationState:
          enum:
          - Unknown
          - Past
          - Current
          - Upcoming
          - All
          type: string
          example: Current
        type:
          enum:
          - Salaried
          - Hourly
          type: string
        id:
          type: string
          format: uuid
        titleIdAtAssignment:
          type:
          - integer
          - 'null'
          format: int64
        upcomingTimeOff:
          type:
          - array
          - 'null'
          items:
            $ref: '#/components/schemas/UnavailabilityResponse'
      additionalProperties: false
    UnavailabilityResponse:
      type: object
      properties:
        id:
          type: integer
          format: int64
          example: 46
        rangeType:
          enum:
          - PreEmployment
          - PostEmployment
          - Unavailability
          - TimeOff
          type: string
          example: Unavailability
        startDate:
          type: string
          format: date-time
          example: '2020-04-21'
        endDate:
          type: string
          format: date-time
          example: '2020-05-21'
        isPrivate:
          type: boolean
          example: false
        description:
          type:
          - string
          - 'null'
          example: Parental Leave
        externalId:
          type:
          - string
          - 'null'
          example: '46'
      additionalProperties: false
    ProjectAllocation:
      type: object
      properties:
        roleId:
          type: integer
          format: int64
          example: 8673
        taskId:
          type:
          - string
          - 'null'
          format: uuid
        allocations:
          type:
          - array
          - 'null'
          items:
            $ref: '#/components/schemas/PersonAllocation'
        taskName:
          type:
          - string
          - 'null'
        categoryId:
          type:
          - integer
          - 'null'
          format: int64
        categoryName:
          type:
          - string
          - 'null'
      additionalProperties: false
  securitySchemes:
    Bearer:
      type: http
      description: Standard Authorization header using the Bearer scheme
      scheme: bearer
      bearerFormat: JWT
