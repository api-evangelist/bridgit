                categoryName: null
            text/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ProjectAllocation'
              example:
              - roleId: 8673
                taskId: null
                allocations:
                - personCost: 123.45
                  personId: 2234
                  name: John Smith
                  title: Project Engineer
                  state: Active
                  startDate: '2020-01-01'
