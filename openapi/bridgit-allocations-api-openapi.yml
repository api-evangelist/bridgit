openapi: 3.2.0
info:
  title: Bench Allocations API
  description: 'Versioning


    The API is currently at version 1.0.'
  version: '1.0'
servers:
- url: https://bench.gobridgit.com
  description: Bridgit Bench production
security:
- {}
tags:
- name: Allocations
paths:
  /rp/api/v1/accounts/{accountId}/projects/{projectId}/Allocations:
    get:
      tags:
      - Allocations
      summary: Gets the allocations for roles in the given account and project
      description: 'Permissions

        Person: Read

        Role: Read

        Allocation: Read

        Private: Read

        Finance: Read'
      operationId: Allocations_Query
      parameters:
      - name: accountId
        in: path
        description: The Account ID
        required: true
        schema:
          type: integer
          format: int32
      - name: projectId
        in: path
        description: The Project ID
        required: true
        schema:
          type: integer
          format: int64
      - name: relativeDate
        in: query
        description: Optional paramater used to calculate date based properties. If not provided, it is set to today's date in UTC.
        schema:
          type: string
          format: date-time
          example: '2021-01-01'
        example: '2021-01-01'
      - name: offset
        in: query
        description: Offset for pagination
        schema:
          maximum: 2147483647
          minimum: 0
          type: integer
          format: int32
          default: 0
      - name: limit
        in: query
        description: Maximum number of results in this page
        schema:
          maximum: 2147483647
          minimum: 1
          type: integer
          format: int32
          default: 1000
      - name: personstate
        in: query
        description: State of persons to filter results by (Default Active)
        schema:
          enum:
          - Active
          - Deactivated
          - All
          type: string
          default: Active
      - name: daysUntilTimeOff
        in: query
        description: Used to calculate the upcoming TimeOff unavailabilities based on the relativeDate
        schema:
          type: integer
          format: int32
          default: 15
      - name: type
        in: query
        description: Salaried role type to filter results by (Default to Operations)
        schema:
          enum:
          - Operations
          - Preconstruction
          - All
          type: string
          default: Operations
      responses:
        '200':
          description: 'Success: List of allocations for roles on the project'
          content:
            text/plain:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ProjectAllocation'
              example:
              - roleId: 8673
                taskId: null
                allocations:
                - personCost: 123.45
                  personId: 2234
                  name: John Smith
                  title: Project Engineer
                  state: Active
                  startDate: '2020-01-01'
                  endDate: '2020-12-31'
                  hasConflict: false
                  allocationState: Current
                  type: 0
                  id: 00000000-0000-0000-0000-000000000000
                  titleIdAtAssignment: null
                  upcomingTimeOff: null
                taskName: null
                categoryId: null
                categoryName: null
              - roleId: 8674
                taskId: null
                allocations:
                - personCost: 123.45
                  personId: 2234
                  name: James William
                  title: Project Manager
                  state: Active
                  startDate: '2019-01-01'
                  endDate: '2019-12-31'
                  hasConflict: false
                  allocationState: Past
                  type: 0
                  id: 00000000-0000-0000-0000-000000000000
                  titleIdAtAssignment: null
                  upcomingTimeOff: null
                taskName: null
                categoryId: null
                categoryName: null
              - roleId: 8675
                taskId: null
                allocations:
                - personCost: 123.45
                  personId: 2234
                  name: Mary Johnson
                  title: Project Coordinator
                  state: Active
                  startDate: '2021-01-01'
                  endDate: '2021-12-31'
                  hasConflict: false
                  allocationState: Upcoming
                  type: 0
                  id: 00000000-0000-0000-0000-000000000000
                  titleIdAtAssignment: null
                  upcomingTimeOff: null
                taskName: null
                categoryId: null
                categoryName: null
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ProjectAllocation'
              example:
              - roleId: 8673
                taskId: null
                allocations:
                - personCost: 123.45
                  personId: 2234
                  name: John Smith
                  title: Project Engineer
                  state: Active
                  startDate: '2020-01-01'
                  endDate: '2020-12-31'
                  hasConflict: false
