              - roleId: 8674
                taskId: null
                allocations:
                - personCost: 123.45
                  personId: 2234
                  name: James William
                  title: Project Manager
                  state: Active
                  startDate: '2019-01-01'
                  endDate: '2019-12-31'
                  hasConflict: false
