      - name: limit
        in: query
        description: Maximum number of results in this page
        schema:
          maximum: 2147483647
          minimum: 1
          type: integer
          format: int32
          default: 5000
      - name: projectId
        in: query
        description: (Optional) Filter role(s) for specified project ID
        schema:
