  /rp/api/v1/Accounts/{id}/collaboration-matrix/_filter:
    post:
      tags:
      - Accounts
      summary: Query the account for instances where two or more persons have collaborated on…
      description: 'When a project ID is supplied, the results will be constrained to the persons within that project.


        If the project ID is omitted, the results will pull for the entire account and can be filtered by person IDs.

        Permissions

        Role: Read

        Allocation: Read

        Person: Read

        HourlyRole: Read

        HourlyAllocation: Read'
      operationId: Accounts_QueryCollaborationMatrix
      parameters:
      - name: id
        in: path
        description: The account ID
        required: true
        schema:
          type: integer
          format: int32
      requestBody:
        description: filter object including personIds, projectId, roleType, salariedRoleType, and roleNameIds
        content:
          application/json-patch+json:
            schema:
              $ref: '#/components/schemas/CollaborationMatrixPredicatesFilter'
          application/json:
            schema:
              $ref: '#/components/schemas/CollaborationMatrixPredicatesFilter'
          text/json:
            schema:
              $ref: '#/components/schemas/CollaborationMatrixPredicatesFilter'
          application/*+json:
            schema:
              $ref: '#/components/schemas/CollaborationMatrixPredicatesFilter'
        required: true
      responses:
        '200':
          description: 'Success: List of projects with person IDs where two or more persons have collaborated'
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/CollaborationMatrixResponse'
            application/json:
              schema:
                $ref: '#/components/schemas/CollaborationMatrixResponse'
