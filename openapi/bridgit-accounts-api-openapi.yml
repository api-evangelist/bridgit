openapi: 3.2.0
info:
  title: Bench Accounts API
  description: 'Versioning


    The API is currently at version 1.0.'
  version: '1.0'
servers:
- url: https://bench.gobridgit.com
  description: Bridgit Bench production
security:
- {}
tags:
- name: Accounts
paths:
  /rp/api/v1/Accounts:
    get:
      tags:
      - Accounts
      summary: Get all accounts that the user has access to
      operationId: Accounts_Query
      parameters:
      - name: offset
        in: query
        description: Offset for pagination
        schema:
          maximum: 2147483647
          minimum: 0
          type: integer
          format: int32
          default: 0
      - name: limit
        in: query
        description: Maximum number of results in this page
        schema:
          maximum: 2147483647
          minimum: 1
          type: integer
          format: int32
          default: 1000
      responses:
        '200':
          description: 'Success: All account models the user has access to'
          content:
            text/plain:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/AccountResponse'
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/AccountResponse'
            text/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/AccountResponse'
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
  /rp/api/v1/Accounts/_filter:
    post:
      tags:
      - Accounts
      summary: Get all accounts that the user has access to, filter by name (contains)…
      description: 'NOTE: Paging limit defaults to 50, and is maximized at 100 items per request. If there are more accounts than were returned, there will be a "query-has-more" header that will be set to true.'
      operationId: Accounts_QueryFilter
      requestBody:
        content:
          application/json-patch+json:
            schema:
              $ref: '#/components/schemas/AccountFilterPredicatesAccountSortSortedFilter'
          application/json:
            schema:
              $ref: '#/components/schemas/AccountFilterPredicatesAccountSortSortedFilter'
          text/json:
            schema:
              $ref: '#/components/schemas/AccountFilterPredicatesAccountSortSortedFilter'
          application/*+json:
            schema:
              $ref: '#/components/schemas/AccountFilterPredicatesAccountSortSortedFilter'
        required: true
      responses:
        '200':
          description: 'Success: All account models the user has access to'
          content:
            text/plain:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/AccountResponse'
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/AccountResponse'
            text/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/AccountResponse'
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
  /rp/api/v1/Accounts/{id}:
    get:
      tags:
      - Accounts
      summary: Gets details for the given account
      description: 'Permissions

        Account: Read'
      operationId: Accounts_Get
      parameters:
      - name: id
        in: path
        description: The Account ID
        required: true
        schema:
          type: integer
          format: int32
      responses:
        '200':
          description: 'Success: Account model'
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/AccountResponse'
            application/json:
              schema:
                $ref: '#/components/schemas/AccountResponse'
            text/json:
              schema:
                $ref: '#/components/schemas/AccountResponse'
        '400':
          description: Bad Request
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
  /rp/api/v1/Accounts/{id}/person-field-values:
    get:
      tags:
      - Accounts
      summary: Get all custom field values for all people for the given account
      description: 'Permissions

        HourlyProfile: Read

        Person: Read

        Private: Read

        Finance: Read'
      operationId: Accounts_QueryProfiles
      parameters:
      - name: id
        in: path
        description: The Account ID
        required: true
        schema:
          type: integer
          format: int32
      - name: includeEmpty
        in: query
        description: If true, the response will include all person field values, even if no value is set for a given field. If false, field values that are empty are not included in the response.
        schema:
          type: boolean
          default: false
      - name: state
        in: query
        description: 'If specified and non-zero, only include field vlaues for people matching the given state. The available values are defined as follows:

          - active: include only Active people

          - deactivated: include only Deactivated people

          - all: include all people, regardless of state'
        schema:
          enum:
          - Active
          - Deactivated
          - All
          type: string
          default: Active
      - name: personIds
        in: query
        description: Optional paramater of comma delimited ids for filtering results based on the person IDs provided
        schema:
          type: array
          items:
            type: integer
            format: int64
      - name: offset
        in: query
        description: The offset of the result to begin with
        schema:
          maximum: 2147483647
          minimum: 0
          type: integer
          format: int32
          default: 0
      - name: limit
        in: query
        description: Optional - The number of items return by result set. If no limit given, return all results
        schema:
          maximum: 2147483647
          minimum: 1
          type: integer
          format: int32
          default: 1000
      - name: employeeId
        in: query
        description: Optional - for filtering result by system field "Employee ID"
        schema:
          type: string
      responses:
        '200':
          description: 'Success: All person field values by person Id on the account'
          content:
            text/plain:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ProfileResponse'
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ProfileResponse'
            text/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ProfileResponse'
        '400':
          description: Bad Request
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
  /rp/api/v1/Accounts/{id}/project-field-values:
    get:
      tags:
      - Accounts
      summary: Get all custom field values for all projects for the given account
      description: 'Permissions

        Project: Read

        Private: Read

        Finance: Read'
      operationId: Accounts_QueryProjectFieldValues
      parameters:
      - name: id
        in: path
        description: The Account ID
        required: true
        schema:
          type: integer
          format: int32
      - name: includeEmpty
        in: query
        description: If true, the response will include all project field values, even if no value is set for a given field. If false, field values that are empty are not included in the response.
        schema:
          type: boolean
          default: false
      - name: projectIds
        in: query
        description: Optional paramater of comma delimited ids for filtering results based on the project IDs provided
        schema:
          type: array
          items:
            type: integer
            format: int64
      - name: offset
        in: query
        description: The offset of the result to begin with
        schema:
          maximum: 2147483647
          minimum: 0
          type: integer
          format: int32
          default: 0
      - name: limit
        in: query
        description: Optional - The number of items return by result set. If no limit given, return all results
        schema:
          maximum: 2147483647
          minimum: 1
          type: integer
          format: int32
          default: 1000
      - name: projectNumber
        in: query
        description: Optional - for filtering result by system field "Project Number"
        schema:
          type: string
      - name: externalId
        in: query
        description: Optional - for filtering result by system field "External ID"
        schema:
          type: string
      - name: classification
        in: query
        description: 'Optional - for filtering result by classification: All or Experience"'
        schema:
          enum:
          - All
          - Experience
          type: string
          default: All
      responses:
        '200':
          description: 'Success: All project field values by person id on the account'
          content:
            text/plain:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ProjectFieldValuesResponse'
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ProjectFieldValuesResponse'
            text/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ProjectFieldValuesResponse'
        '400':
          description: Bad Request
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
  /rp/api/v1/Accounts/{id}/tasks:
    get:
      tags:
      - Accounts
      summary: Get all Tasks for all projects in the given account
      description: 'Permissions

        Project: Read

        Person: Read

        Role: Read

        Allocation: Read'
      operationId: Accounts_QueryTasks
      parameters:
      - name: id
        in: path
        description: The Account ID
        required: true
        schema:
          type: integer
          format: int32
      - name: relativeDate
        in: query
        description: Optional paramater used to calculate date based properties. If not provided, it is set to today's date in UTC.
        schema:
          type: string
          format: date-time
          example: '2021-01-01'
        example: '2021-01-01'
      - name: offset
        in: query
        description: Offset for pagination
        schema:
          maximum: 2147483647
          minimum: 0
          type: integer
          format: int32
          default: 0
      - name: limit
        in: query
        description: Maximum number of results in this page
        schema:
          maximum: 2147483647
          minimum: 1
          type: integer
          format: int32
          default: 5000
      - name: projectIds
        in: query
        description: (Optional) Filter task(s) to contain tasks that match the projectIds passed in.
        schema:
          type: array
          items:
            type: integer
            format: int64
      - name: projectState
        in: query
        description: (Optional) Filters the result by the state of the project the role is on
        schema:
          enum:
          - Canceled
          - Upcoming
          - Active
          - Complete
          - Pursuit
          - Lost
          - All
          type: string
          default: All
      - name: taskIds
        in: query
        description: (Optional) Filters the result to contain tasks that match the taskIds passed in. Works as an AND with filledState and roleNameIds
        schema:
          type: array
          items:
            type: string
            format: uuid
      - name: filledState
        in: query
        description: (Optional) Filters the result by the filled state of the roles
        schema:
          enum:
          - 0
          - 1
          - 2
          type: integer
          format: int32
          default: 2
      - name: roleIds
        in: query
        description: (Optional) Filters the result to contain roles that match the ids passed in. Works as an AND with filledState and roleNameIds
        schema:
          type: array
          items:
            type: integer
            format: int64
      - name: roleNameIds
        in: query
        description: (Optional) Filters the result to contain roles that match the ids passed in. Works as an AND with filledState and roleIds
        schema:
          type: array
          items:
            type: integer
            format: int64
      - name: roleState
        in: query
        description: '(Optional) Filters the result by the state of the role dates: Current, Upcoming, Past, or All'
        schema:
          enum:
          - Past
          - Current
          - Upcoming
          - All
          type: string
          default: All
      responses:
        '200':
          description: 'Success: All tasks on projects in the given account with some project information, role requirements and allocations'
          content:
            text/plain:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ProjectTaskDetail'
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ProjectTaskDetail'
            text/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ProjectTaskDetail'
        '400':
          description: Bad Request
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
  /rp/api/v1/Accounts/{id}/role-categories:
    get:
      tags:
      - Accounts
      summary: Get all categories for all projects in the given account
      description: 'Permissions

