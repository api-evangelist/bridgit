apis:
  - aid: bridgit:bridgit-bench
    name: Bridgit Bench API
    description: >-
      The Bridgit Bench REST API lets developers build custom integrations
      against the Bench workforce planning platform — managing accounts,
      projects, people, roles, allocations (including hourly), phases,
      certifications, person and project custom fields, groupings, notes,
      tasks, attachments, workforce spend reports, and user/service-account
      administration. Authentication uses OAuth bearer tokens issued by
      POST /auth/signin against a service account; refresh tokens may be
      exchanged at POST /auth/token. All resource paths live under
      https://bench.gobridgit.com/rp/api/v1/.
    humanURL: https://gobridgit.com/bridgit-bench-api-documentation/
    baseURL: https://bench.gobridgit.com/rp/api/v1
