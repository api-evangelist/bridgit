aid: bridgit
name: Bridgit
description: >-
  Bridgit is a Kitchener, Ontario-based construction technology company
  founded in 2012 by Mallorie Brodie and Lauren Lake. Its flagship product
  is Bridgit Bench, an AI-first workforce planning platform built
  exclusively for construction general contractors and subcontractors. Bench
  centralizes project staffing, role assignments, forecasting, utilization,
  time-off, internal resumes, and certifications, replacing the spreadsheets
  most contractors still use to plan their people across pursuits and active
  projects. Bridgit is trusted by nearly 40% of the ENR 400 and serves
  customers across North America, the United Kingdom, Australia, and New
  Zealand. The company has raised over $35M USD from investors including
  Autodesk, Salesforce Ventures, Sands Capital, BDC Capital, and Camber
  Creek. Bridgit Bench exposes a documented REST API (OpenAPI 3.0) for
  managing accounts, projects, people, roles, allocations, certifications,
  and groupings, and ships pre-built integrations across CRM (Salesforce,
  HubSpot, Microsoft Dynamics, Unanet, Zoho, Pipedrive), HRIS/ERP (Workday,
  BambooHR, UKG, Oracle, ADP, Namely), project management (Procore,
  Autodesk Build, CMiC, Trimble), and data warehouses (Snowflake,
  Office 365).
